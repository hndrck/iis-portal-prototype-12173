<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IIS Portal Prototype</title>
    <!-- GitHub Pages SPA redirect -->
    <script>
      // Store the path for redirect after page reload
      sessionStorage.setItem('redirect', window.location.pathname + window.location.search + window.location.hash);
      // Redirect to index.html (works for both custom domain and github.io)
      window.location.replace('/');
    </script>
  </head>
  <body>
    <div>Redirecting...</div>
  </body>
</html>
